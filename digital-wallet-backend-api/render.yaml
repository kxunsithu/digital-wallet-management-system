      - key: APP_DEBUG
        value: "true"
      - key: APP_URL
        value: https://smart-wallet-api-vm58.onrender.com
      - key: APP_KEY
        value: "base64:SJ18kMSpB72OOa1U20hYRqCfKyqg6Ispb8QvIBde9TM="
